<?xml version="1.0" encoding="UTF-8"?>
<!-- SUMO Configuration File -->
<configuration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="simple.net.xml"/>
        <route-files value="simple.rou.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="3600"/>
        <step-length value="0.1"/>
    </time>

    <processing>
        <time-to-teleport value="-1"/>
        <max-depart-delay value="1"/>
        <default.speeddev value="0.1"/>
    </processing>

    <routing>
        <device.rerouting.probability value="0.3"/>
        <device.rerouting.period value="60"/>
    </routing>

    <report>
        <verbose value="false"/>
        <no-step-log value="true"/>
        <no-warnings value="false"/>
    </report>

    <gui_only>
        <gui-settings-file value=""/>
        <window-size value="1280,720"/>
        <window-pos value="100,100"/>
        <gui-testing value="false"/>
        <gui-testing.setting-output value=""/>
    </gui_only>

</configuration>
